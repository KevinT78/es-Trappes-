name: Generate Swagger Documentation

on:
  push:
    branches: [main, master, develop]

jobs:
  generate-swagger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mistralai openai pyyaml flask fastapi django requests pyyaml

      - name: Generate Swagger Documentation
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python .github/scripts/generate_swagger.py

      - name: Commit & Push Swagger Docs
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add swagger.json swagger.yaml docs/
          git commit -m "Update Swagger docs [skip ci]" || echo "No changes"
          git push
